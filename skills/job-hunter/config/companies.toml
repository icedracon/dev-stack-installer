# Seed list of ATS job boards to poll. Add your own in
# ~/.job-hunter/config/companies.toml (same format; same ats+token overrides,
# `enabled = false` disables a bundled entry) or with `jh sources add`.
#
# WARNING: these tokens are best-effort from the author's knowledge and could NOT
# be verified when written (network egress was blocked). Companies switch ATS
# vendors regularly. Run `jh sources verify` once; dead boards are reported and
# auto-skipped after 3 consecutive failures.
#
# Selection bias: security-relevant employers with a history of remote hiring.
# Being on this list says nothing about whether they hire in Armenia.
#
# ats: greenhouse | lever | ashby | workable | smartrecruiters | remotive

