# Skill taxonomy: canonical key -> case-insensitive regex aliases.
# Used to extract skills from job text and to match against profile [skills].
# Aliases are wrapped in (?<!\w)...(?!\w) guards automatically (works for c#, c++). Keep aliases specific:
# a noisy alias (e.g. bare "AD") inflates overlap for every job.

[aliases]
active_directory = ['active directory', 'entra id', 'azure ad', 'ldap', 'bloodhound', 'group policy']
kerberos = ['kerberos', 'kerberoast\w*', 'ntlm', 'pass[- ]the[- ](hash|ticket)', 'delegation attacks?']
adcs = ['ad cs', 'adcs', 'active directory certificate services', 'certipy', 'esc\d+']
windows_internals = ['windows internals', 'win32', 'windows api', 'winapi', 'windows kernel', '\.net internals', 'com objects?']
windows_security = ['windows security', 'windows hardening', 'windows exploitation', 'sysmon', 'windows event logs?']
powershell = ['powershell']
python = ['python']
rust = ['rust']
c_cpp = ['c\+\+', 'c/c\+\+', 'cpp']
golang = ['golang', 'go programming', 'go language']
csharp = ['c#', 'csharp', '\.net']
javascript = ['javascript', 'typescript', 'node\.?js']
java = ['java', 'kotlin']
reverse_engineering = ['reverse engineering', 'reversing', 'ida pro', 'ghidra', 'binary ninja', 'disassembl\w*', 'decompil\w*']
exploit_development = ['exploit development', 'exploit dev', 'exploitation', 'rop chains?', 'memory corruption', 'heap exploitation']
fuzzing = ['fuzzing', 'fuzzers?', 'afl\+*', 'libfuzzer', 'syzkaller']
vulnerability_research = ['vulnerability research', '0-?day', 'zero[- ]day', 'variant analysis', 'root cause analysis']
bug_bounty = ['bug bounty', 'hackerone', 'bugcrowd', 'intigriti', 'responsible disclosure', 'cves?']
web_appsec = ['owasp', 'web application security', 'burp suite', 'burp', 'xss', 'ssrf', 'sql injection', 'web vulnerabilities', 'api security']
threat_modeling = ['threat model\w*', 'stride', 'security design reviews?', 'architecture reviews?']
